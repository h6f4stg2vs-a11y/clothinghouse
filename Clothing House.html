function calc(){const d=DATA,c={w:{},it:{},su:{},cu:{},pa:{}};
 d.wallets.forEach(w=>c.w[w.id]=0);d.moves.forEach(m=>{if(m.wallet in c.w)c.w[m.wallet]+=m.amt});
 d.items.forEach(i=>c.it[i.id]={inQ:0,cost:0,out:0});d.suppliers.forEach(x=>c.su[x.id]=0);d.customers.forEach(x=>c.cu[x.id]=0);
 d.purchases.forEach(p=>{LN(p,"cost").forEach(l=>{const i=c.it[l.item];if(i){i.inQ+=l.qty;i.cost+=l.qty*l.cost}});if(p.supplier in c.su)c.su[p.supplier]+=TOT(p,"cost")-p.paid});
 d.sales.forEach(s=>{LN(s,"price").forEach(l=>{const i=c.it[l.item];if(i)i.out+=l.qty});if(s.customer in c.cu)c.cu[s.customer]+=TOT(s,"price")-s.paid});
 d.moves.forEach(m=>{if(m.kind=="sup_pay"&&m.party in c.su)c.su[m.party]-=Math.abs(m.amt);if(m.kind=="cus_pay"&&m.party in c.cu)c.cu[m.party]-=m.amt});
 d.partners.forEach(x=>c.pa[x.id]=0);d.sales.forEach(s=>{if(s.partner in c.pa)c.pa[s.partner]+=s.comm||0});d.moves.forEach(m=>{if(m.kind=="par_pay"&&m.party in c.pa)c.pa[m.party]-=Math.abs(m.amt)});
 d.returns.forEach(r=>{const v=r.qty*r.price,i=c.it[r.item];if(r.kind=="cus"){if(i)i.out-=r.qty;if(r.settle=="debt"&&r.party in c.cu)c.cu[r.party]-=v}else{if(i){i.inQ-=r.qty;i.cost-=v}if(r.settle=="debt"&&r.party in c.su)c.su[r.party]-=v}});
 d.items.forEach(x=>{const i=c.it[x.id];i.avg=i.inQ?i.cost/i.inQ:0;i.stock=x.type=="s"?Infinity:i.inQ-i.out});return c}
